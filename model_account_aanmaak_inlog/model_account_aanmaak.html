<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inlog model</title>
    <link rel="stylesheet" href="css/model_account_aanmaak.css">
</head>
<body>

    <div class="bubble_big"></div>

    <div class="inlog_container">

    <p class="login">meld je aan en word model</p>

    <form action="" class="inlog_form">

        <!-- naam -->
        <label for="">naam</label>    <br>
        <input type="text" class="input_tekst" placeholder="voor en achternaam">

        <!-- wachtwoord -->
        <label for="">wachtwoord</label>  
        <input type="text" class="input_tekst" placeholder="w2chtW00rd">>

        <label for="">e-mail</label>  
        <input type="text" class="input_tekst" placeholder="voor@beeld.com">

        <label for="">contact mogelijkheid</label>  
        <input type="text" class="input_tekst" placeholder="telefoonnummer, sociale media, ect">

        <!-- beschrijving -->
        <label for="">beschrijving</label>  
        <input type="text" class="input_tekst" placeholder="informatie over jezelf"> 

        <!-- profiel foto -->
        <label for="">profiel foto (max 3)</label> <br>
        <input class="file_upload" type="file" >
        <br><br>
        <input type="submit">


    </form>
    </div>
</body>
</html>
